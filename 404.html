<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Single Page App for GitHub Pages</title>
  <script type="text/javascript">
    // Single Page Apps for GitHub Pages
    // MIT License
    // https://github.com/rafgraph/spa-github-pages
    // This script takes the current url and converts the path and query
    // string into just a query string, and then redirects back to index.html
    // with that query string. This allows the react-router to understand the
    // route as if it was a real url.
    var l = window.location;
    l.replace(
      l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') + l.pathname.split('/').slice(0, -1).join('/') + '/?page=' + l.pathname.slice(1).split('/').join('&') + (l.search ? '&' + l.search.slice(1) : '') + l.hash
    );
  </script>
</head>
<body>
</body>
</html>
